services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    restart: always
    volumes:
      - ./config_prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    extra_hosts:
      - "my.host.local:host-gateway"
  
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    environment:
      - GF_SERVER_ROOT_URL=http://my.grafana.server/
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel
      - GF_SECURITY_ADMIN_PASSWORD=ecs8612
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./config_grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml  
      - grafana_storage:/var/lib/grafana

volumes:
  grafana_storage: {}
  prometheus_data: {}