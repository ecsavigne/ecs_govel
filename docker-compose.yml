# Aqui los container se van a conectar a una red external llamada my_whatsmeow_whatsmeow que es la crfeada por el container de la base datos
# se crea un extra host para los servicios asociado a un nombre de host local  my.host.local 

services:
  # Servicio del proxy en Go
  ${SERVICE_NAME}:
    build:
      context: ./gofiles
      dockerfile: Dockerfile
    container_name: ${SERVICE_NAME}
    entrypoint: ["sh", "-c", "${MY_CMD}"]
    ports:
       - "${PORT_EXEC}:8080"
    volumes:
      - ./gofiles/project_file:/app
      - ./ig_service_official.conf:/etc/supervisor/conf.d/ig_service_official.conf
    networks:
      external-network: # <--- Usamos el nombre lógico definido abajo
        ipv4_address: 192.168.40.10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

networks:
    external-network: # <--- Nombre lógico para este archivo
        external: true
        name: ${DOCKER_EXTERNAL_NETWORK} # <--- El nombre REAL que ves en 'docker network ls', tiene que tener subnet 192.168.40.0/24. ex: docker network create --driver bridge --subnet 192.168.10.0/24 my_red, donde DOCKER_EXTERNAL_NETWORK=my_red 
   
    # Red criada pode ser criada $ docker network create my_networks_dockers
    #     networks:
    # mongodb_enterprise:
    #     name: nomeservice_my_networks_dockers
    #     driver: bridge