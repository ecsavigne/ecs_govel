    whatsmeow-pgsql:
        container_name: whatsmeow-pgsql
        image: 'postgres:14'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        command: postgres -c 'max_connections=1000'
        environment:
            PGPASSWORD: '${PGSQL_PGPASSWORD}'
            POSTGRES_DB: '${PGSQL_DB_DATABASE}'
            POSTGRES_USER: '${PGSQL_POSTGRES_USER}'
            POSTGRES_PASSWORD: '${PGSQL_POSTGRES_PASSWORD}'
        volumes:
            - 'whatsmeow-pgsql:/var/lib/postgresql/data'
        networks:
            - whatsmeow
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", '${PGSQL_DB_DATABASE}', "-U", '${PGSQL_POSTGRES_USER}']
            retries: 3
            timeout: 5s
        # restart: always
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 8192M
                reservations:
                    cpus: '0.25'
                    memory: 6144M

    # redis:
